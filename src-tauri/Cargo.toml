[package]
name = "nettune"
version = "0.1.0"
description = "Local-first Linux network diagnostics and safe optimization assistant"
license = "MIT"
repository = "https://github.com/ttat288/nettune"
homepage = "https://github.com/ttat288/nettune"
keywords = ["network", "diagnostics", "linux", "wifi", "networkmanager"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nettune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
